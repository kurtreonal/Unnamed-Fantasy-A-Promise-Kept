name: Publish playable web game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: godot-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot and web templates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/setup_godot.py --platform web
      - name: Import project
        run: godot --headless --path . --editor --import
      - name: Test redesigned campaign and gameplay
        run: |
          trap 'rm -f override.cfg' EXIT
          printf '[application]\nconfig/name="A Promise Kept Redesign Smoke CI"\nconfig/use_custom_user_dir=true\nconfig/custom_user_dir_name="A Promise Kept Redesign Smoke CI"\n' > override.cfg
          for suite in redesign_smoke redesign_integration; do
            godot --headless --path . --script "tests/$suite.gd" --quit-after 1800 2>&1 | tee "$RUNNER_TEMP/$suite.log"
            grep -q 'PASS:' "$RUNNER_TEMP/$suite.log"
            if grep -E 'SCRIPT ERROR:|^ERROR:' "$RUNNER_TEMP/$suite.log" | grep -vE 'resources still in use|RID allocations'; then exit 1; fi
          done
          godot --headless --path . --script tests/redesign_touch.gd --quit-after 1800 -- --touch-test 2>&1 | tee "$RUNNER_TEMP/touch.log"
          grep -q 'PASS: touch movement' "$RUNNER_TEMP/touch.log"
          if grep -E 'SCRIPT ERROR:|^ERROR:' "$RUNNER_TEMP/touch.log" | grep -vE 'resources still in use|RID allocations'; then exit 1; fi
      - name: Export browser game
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          touch build/web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
