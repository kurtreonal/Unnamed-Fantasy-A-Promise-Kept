name: Build signed Android release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the version in project.godot
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate signing setup and version
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Configure the three Android signing secrets described in RELEASE.md.'; exit 1; }
          python3 - <<'PY'
          import os, pathlib, re
          version = re.search(r'config/version="([^"]+)"', pathlib.Path('project.godot').read_text())[1]
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Update project and Android preset versions before tagging.'
          PY
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.2
          use-dotnet: false
          include-templates: true
          path: ${{ runner.temp }}/godot
          downloads-path: ${{ runner.temp }}/godot-downloads
          bin-path: ${{ runner.temp }}/godot-bin
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Configure Android SDK
        run: |
          sdkmanager 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35'
          python3 tools/configure_android.py --java "$JAVA_HOME" --sdk "$ANDROID_HOME"
      - name: Import and export signed APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.p12
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p build/android
          godot --headless --path . --editor --import
          godot --headless --path . --export-release Android "build/android/unnamed-fantasy-${RELEASE_TAG}.apk"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "build/android/unnamed-fantasy-${RELEASE_TAG}.apk"
          sha256sum build/android/*.apk > build/android/SHA256SUMS.txt
      - name: Publish release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title "Unnamed Fantasy ${RELEASE_TAG}" --generate-notes
          gh release upload "$RELEASE_TAG" build/android/*.apk build/android/SHA256SUMS.txt --clobber
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
